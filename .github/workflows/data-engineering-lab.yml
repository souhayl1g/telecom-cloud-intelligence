name: Data engineering lab checks
on: [push, pull_request]
jobs:
  test:
    defaults:
      run:
        working-directory: examples/data-engineering-lab
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m datalab demo --out artifacts
