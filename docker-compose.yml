services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telecom_intel
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom_pw
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U telecom -d telecom_intel" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - miniodata:/data

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      JWT_SECRET: ${JWT_SECRET:-telecom-dev-secret-change-in-prod}
      JWT_EXPIRE_MINUTES: "1440"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8002/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8002/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      AUTH_SERVICE_URL: http://auth-service:8002
      JWT_SECRET: ${JWT_SECRET:-telecom-dev-secret-change-in-prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  ai-service:
    build: ./services/ai-service
    ports:
      - "8001:8001"
    volumes:
      - aimodels:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  pipeline-worker:
    build: ./services/pipeline-worker
    volumes:
      - ./services/pipeline-worker/worker:/app/worker
    environment:
      RUN_MODE: daemon
      AI_SERVICE_URL: http://ai-service:8001
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring:/etc/prometheus-config:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus-config/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  aimodels:
  prometheusdata:
  grafanadata:
