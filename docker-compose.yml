services:
  postgres:
    image: postgres:16
    command: >-
      postgres -c shared_buffers=256MB -c work_mem=8MB -c effective_cache_size=768MB
               -c max_connections=60 -c maintenance_work_mem=64MB
               -c random_page_cost=1.1 -c temp_file_limit=1GB
    environment:
      POSTGRES_DB: telecom_intel
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom_pw
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U telecom -d telecom_intel" ]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1500m
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - miniodata:/data
    mem_limit: 512m

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      JWT_SECRET: ${JWT_SECRET:-telecom-dev-secret-change-in-prod}
      JWT_EXPIRE_MINUTES: "1440"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8002/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8002/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: auth-service
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      AUTH_SERVICE_URL: http://auth-service:8002
      AGENT_SERVICE_URL: http://agent-service:8003
      JWT_SECRET: ${JWT_SECRET:-telecom-dev-secret-change-in-prod}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  ai-service:
    build: ./services/ai-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ai-service
    ports:
      - "8001:8001"
    volumes:
      - ./services/ai-service/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy

  pipeline-worker:
    build: ./services/pipeline-worker
    volumes:
      - ./services/pipeline-worker/worker:/app/worker
    environment:
      # Daemon mode: continuous 2-min cycles with real BSS+OSS data.
      # Switch to RUN_MODE=oneshot for one-off runs during debugging.
      RUN_MODE: daemon
      CYCLE_SECONDS: "120"
      USE_REAL_DATA: "true"
      SAMPLE_MONTH: "2026-03"
      AI_SERVICE_URL: http://ai-service:8001
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    mem_limit: 768m

  agent-service:
    build: ./services/agent-service
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      API_GATEWAY_URL: http://api-gateway:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent-service
    ports:
      - "8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      AUTH_SERVICE_URL: http://auth-service:8002
      NEXT_PUBLIC_API_BASE_URL: http://api-gateway:8000
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: kimi-k2.5:cloud
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1024m
    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  notebooks:
    build:
      context: .
      dockerfile: Dockerfile.notebooks
    environment:
      AUTO_PIPELINE: ${AUTO_PIPELINE:-false}
      PIPELINE_MODE: ${PIPELINE_MODE:-oneshot}
      PIPELINE_TIMEOUT: ${PIPELINE_TIMEOUT:-120}
      JUPYTER_PORT: ${JUPYTER_PORT:-8888}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
      AI_SERVICE_URL: http://ai-service:8001
      PIPELINE_LOG_LEVEL: ${PIPELINE_LOG_LEVEL:-INFO}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks:ro
      - notebooks_data:/app/data
      - notebooks_logs:/app/logs
      - notebooks_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Lightweight Observability Stack (Netdata + Prometheus + Grafana + Jaeger) ──
  netdata:
    image: netdata/netdata:v1.47
    container_name: netdata
    hostname: netdata
    ports:
      - "19999:19999"
    environment:
      NETDATA_CLAIM_TOKEN: ""
      NETDATA_CLAIM_URL: ""
      NETDATA_CLAIM_ROOMS: ""
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    mem_limit: 512m
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    restart: on-failure

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 256m
    restart: on-failure

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    container_name: jaeger
    hostname: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (receives traces from otel-collector)
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    mem_limit: 512m
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: otel-collector
    hostname: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    ports:
      - "4319:4317"   # OTLP gRPC — services send telemetry here
      - "4320:4318"   # OTLP HTTP
    volumes:
      - ./infra/monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - prometheus
      - jaeger
    mem_limit: 256m
    restart: on-failure

volumes:
  pgdata:
  miniodata:
  notebooks_data:
  notebooks_logs:
  notebooks_models:
  netdata_config:
  netdata_lib:
  netdata_cache:
  prometheus_data:
  grafana_data:
