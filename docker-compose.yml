version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telecom_intel
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom_pw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom_intel"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - miniodata:/data

  api-gateway:
    build: ./services/api-gateway
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    build: ./services/ai-service
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  pipeline-worker:
    build: ./services/pipeline-worker
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
