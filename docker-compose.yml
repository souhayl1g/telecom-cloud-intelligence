services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telecom_intel
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom_pw
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U telecom -d telecom_intel" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - miniodata:/data

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      JWT_SECRET: ${JWT_SECRET:-telecom-dev-secret-change-in-prod}
      JWT_EXPIRE_MINUTES: "1440"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8002/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8002/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: auth-service
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    environment:
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      AUTH_SERVICE_URL: http://auth-service:8002
      JWT_SECRET: ${JWT_SECRET:-telecom-dev-secret-change-in-prod}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  ai-service:
    build: ./services/ai-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ai-service
    ports:
      - "8001:8001"
    volumes:
      - notebooks_models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  pipeline-worker:
    build: ./services/pipeline-worker
    volumes:
      - ./services/pipeline-worker/worker:/app/worker
    environment:
      RUN_MODE: daemon
      AI_SERVICE_URL: http://ai-service:8001
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started

  dashboard:
    build: ./dashboard
    environment:
      AUTH_SERVICE_URL: http://auth-service:8002
      NEXT_PUBLIC_API_BASE_URL: http://api-gateway:8000
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: kimi-k2.5:cloud
    ports:
      - "3001:3001"
    depends_on:
      api-gateway:
        condition: service_started
      auth-service:
        condition: service_started

  notebooks:
    build:
      context: .
      dockerfile: Dockerfile.notebooks
    environment:
      AUTO_PIPELINE: ${AUTO_PIPELINE:-false}
      PIPELINE_MODE: ${PIPELINE_MODE:-oneshot}
      PIPELINE_TIMEOUT: ${PIPELINE_TIMEOUT:-120}
      JUPYTER_PORT: ${JUPYTER_PORT:-8888}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
      DATABASE_URL: postgresql://telecom:telecom_pw@postgres:5432/telecom_intel
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_pw
      AI_SERVICE_URL: http://ai-service:8001
      PIPELINE_LOG_LEVEL: ${PIPELINE_LOG_LEVEL:-INFO}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks:ro
      - notebooks_data:/app/data
      - notebooks_logs:/app/logs
      - notebooks_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── SigNoz Observability Stack (replaces Prometheus + Grafana) ─────────────
  zookeeper-1:
    image: bitnamilegacy/zookeeper:3.7.1
    container_name: signoz-zookeeper
    hostname: zookeeper-1
    user: "1001"
    environment:
      ZOO_SERVER_ID: 1
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: 1
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: signoz-clickhouse
    hostname: clickhouse
    tty: true
    depends_on:
      - zookeeper-1
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
      - ./infra/monitoring/clickhouse-config.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./infra/monitoring/clickhouse-users.xml:/etc/clickhouse-server/users.d/admin.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: on-failure

  signoz-alertmanager:
    image: signoz/alertmanager:0.23.4
    container_name: signoz-alertmanager
    volumes:
      - ./infra/monitoring/signoz-alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: on-failure

  signoz-query-service:
    image: signoz/query-service:0.55.0
    container_name: signoz-query-service
    hostname: query-service
    command:
      - "--config=/root/config/prometheus.yml"
    environment:
      ClickHouseUrl: tcp://admin:27ff0399-0d3a-4bd8-919d-17c2181e6fb9@clickhouse:9000
      ALERTMANAGER_API_PREFIX: http://signoz-alertmanager:9093/api/
      SIGNOZ_LOCAL_DB_PATH: /var/lib/signoz/signoz.db
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "false"
      DEPLOYMENT_TYPE: docker-standalone-amd
    volumes:
      - ./infra/monitoring/signoz-prometheus.yml:/root/config/prometheus.yml:ro
      - signoz_data:/var/lib/signoz
    depends_on:
      - clickhouse
      - signoz-alertmanager
    restart: on-failure

  signoz-frontend:
    image: signoz/frontend:0.55.0
    container_name: signoz-frontend
    hostname: signoz-frontend
    ports:
      - "3301:3301"
    volumes:
      - ./infra/monitoring/signoz-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - signoz-query-service
    restart: on-failure

  otel-collector:
    image: signoz/signoz-otel-collector:0.102.11
    container_name: signoz-otel-collector
    hostname: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_CLUSTER=cluster
      - CLICKHOUSE_DATABASE=signoz_metrics
      - CLICKHOUSE_TRACE_DATABASE=signoz_traces
      - DOCKER_MULTI_NODE_CLUSTER=false
    ports:
      - "4317:4317"   # OTLP gRPC — services send telemetry here
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - clickhouse
    restart: on-failure

volumes:
  pgdata:
  miniodata:
  notebooks_data:
  notebooks_logs:
  notebooks_models:
  zookeeper_data:
  clickhouse_data:
  signoz_data:
