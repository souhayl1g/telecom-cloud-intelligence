<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, var(--tw-colors-surface-container-high) 0%, transparent 60%);"></div>

<form class="space-y-space-6">
<div class="space-y-space-2">

</span>

</div>
</div>
<div class="space-y-space-2">
<div class="flex justify-between items-center">
<label class="block font-badge-status text-badge-status text-text-secondary uppercase tracking-wider" for="password">Access Token</label>
<a class="font-caption-meta text-caption-meta text-accent-orange hover:text-danger transition-colors" href="#">Reset Token?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-space-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted text-lg" data-icon="lock">lock</span>
</span>
<input class="w-full bg-surface-container border border-border-base text-text-primary font-body-standard text-body-standard rounded-DEFAULT py-2 pl-10 pr-space-3 focus:outline-none focus:border-border-active focus:ring-1 focus:ring-border-active transition-colors placeholder-text-muted/50" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-gradient-to-r from-danger to-accent-orange text-white font-h3-card text-h3-card py-3 rounded-DEFAULT hover:opacity-90 transition-opacity flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(239,68,68,0.3)] mt-space-8" type="submit">
<span>Initialize Session</span>
<span class="material-symbols-outlined text-sm" data-icon="login">login</span>
</button>
</form>
<div class="mt-space-8 flex items-center justify-between">
<span class="h-px w-full bg-border-base"></span>
<span class="font-caption-meta text-caption-meta text-text-muted px-space-3 whitespace-nowrap uppercase">SSO Authorization</span>
<span class="h-px w-full bg-border-base"></span>
