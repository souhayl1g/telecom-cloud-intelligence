global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: "api-gateway"
          layer: "gateway"

  - job_name: "ai-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8001"]
        labels:
          service: "ai-service"
          layer: "inference"
