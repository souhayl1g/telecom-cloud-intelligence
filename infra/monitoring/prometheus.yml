global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Netdata metrics (system + container monitoring)
  - job_name: "netdata"
    static_configs:
      - targets: ["netdata:19999"]
    metrics_path: "/api/v1/allmetrics"
    params:
      format: [prometheus]

  # FastAPI services metrics
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: "/metrics"

  - job_name: "ai-service"
    static_configs:
      - targets: ["ai-service:8001"]
    metrics_path: "/metrics"

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8002"]
    metrics_path: "/metrics"

  - job_name: "agent-service"
    static_configs:
      - targets: ["agent-service:8003"]
    metrics_path: "/metrics"
